name: Study A v2 integration checks (synthetic only)
on:
  push:
    branches:
      - experiment/study-a-v2-integracion-20261112
      - experiment/study-a-v2-relative-reference-20261112
      - experiment/study-b-holdout-independiente-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<4' 'scikit-learn>=1.5,<2' 'optuna>=4,<5' 'xgboost>=2,<4' 'lightgbm>=4,<5' 'catboost>=1.2,<2' 'joblib>=1.3' 'psutil>=5.9,<8' 'pytest>=8,<10' 'requests>=2,<3' 'python-dotenv>=1,<2'
      - name: Check existing v2 unit tests and new smoke tests
        run: |
          python -m pytest -q tests/test_study_a_v2.py tests/test_study_a_v2_integration.py tests/test_study_a_v2_relative_reference.py tests/test_study_b_independent.py
