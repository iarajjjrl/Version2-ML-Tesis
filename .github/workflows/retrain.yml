name: Event-Driven Self-Service MLOps Pipeline

on:
  repository_dispatch:
    types: [data_drift_detected]

# 🔹 CONTROL DE CONCURRENCIA: Solo 1 ejecutor activo a la vez
concurrency:
  group: mlops-retraining-pipeline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ephemeral_retraining:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Codigo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configurar Entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn==1.7.2 optuna joblib requests python-dotenv xgboost lightgbm catboost

    - name: Ejecutar Autoajuste Bayesiano y Guardrails (Optuna)
      env:
        LOTE_DRIFT_PATH: "data/prod_lote2_drift.csv"
      run: |
        python src/auto_tune.py

    - name: Publicar Modelo Actualizado al Repositorio (Auto-Commit)
      if: success()
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "robot: [MLOps Auto-Retrain] Modelo y dataset consolidados tras deteccion de Data Drift [skip ci]"
        file_pattern: "models/*.pkl models/active_model.json data/datos_entrenamiento.csv"
        commit_user_name: "Bot MLOps"
        commit_user_email: "mlops-bot@github.com"
        add_options: '-f'

    - name: Registrar Artefacto Optimizado
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: modelo-versionado-y-manifiesto
        path: |
          models/*.pkl
          models/active_model.json
