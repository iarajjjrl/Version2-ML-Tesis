name: Event-Driven Self-Service MLOps Pipeline

on:
  repository_dispatch:
    types: [data_drift_detected]

# Otorga permisos al bot de GitHub para hacer commit y push sobre el repositorio
permissions:
  contents: write

jobs:
  ephemeral_retraining:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Codigo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configurar Entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn==1.9.0 optuna joblib

    - name: Ejecutar Autoajuste Bayesiano y Guardrails (Optuna)
      run: |
        python src/auto_tune.py

    - name: Publicar Modelo Actualizado al Repositorio (Auto-Commit)
      if: success()
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "robot: [MLOps Auto-Retrain] Modelo actualizado tras deteccion de Data Drift"
        file_pattern: "models/modelo_vigente.pkl"

    - name: Registrar Artefacto Optimizado
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: modelo-vigente-reentrenado
        path: models/modelo_vigente.pkl