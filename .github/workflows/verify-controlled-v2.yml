name: Verificar integración controlador MLOps v2

on:
  push:
    branches:
      - experiment/integracion-controlador-mlops-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy_contract:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama del experimento
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar sintaxis
        run: |
          python -m py_compile src/experiments/v2/controller.py
          python -m py_compile src/mlops/controller_bridge.py
          python -m py_compile src/mlops/controlled_v2.py
          python -m py_compile src/mlops/watch_controlled_v2.py
      - name: Contrato temporal con controlador compartido
        run: python -m unittest discover -s tests -p 'test_controlled_policy_bridge.py' -v

# IMPORTANTE: este workflow NO entrena, publica ni cambia models/ o main.
# Los lotes IEEE-CIS estan fuera de GitHub y deben probarse por separado.

  adapter_smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama del experimento
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias para prueba de integración
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn optuna xgboost lightgbm catboost joblib
      - name: Probar adaptador con lotes sintéticos
        run: python -m unittest discover -s tests -p 'test_controlled_adapter_v2.py' -v
      - name: Probar entrenamiento real de cinco familias sobre datos artificiales
        timeout-minutes: 12
        run: python -m unittest discover -s tests -p 'test_controlled_real_training.py' -v

# El adapter_smoke sustituye el entrenamiento por un modelo ficticio.
# No demuestra todavía calidad predictiva ni despliegue en nube.
